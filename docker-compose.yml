services:
  postgres:
    image: postgres:17-alpine
    command: ['postgres', '-c', 'wal_level=logical']
    environment:
      POSTGRES_USER: tomato
      POSTGRES_PASSWORD: tomato
      POSTGRES_DB: tomato
    ports:
      - '5432:5432'
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./docker/postgres/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U tomato -d tomato']
      interval: 5s
      timeout: 5s
      retries: 10

  kafka:
    image: apache/kafka:3.9.0
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093,EXTERNAL://:29092
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092,EXTERNAL://localhost:29092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,EXTERNAL:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
    ports:
      - '29092:29092'
    volumes:
      - kafka-data:/var/lib/kafka/data

  debezium:
    image: quay.io/debezium/connect:3.6
    depends_on:
      - kafka
      - postgres
    environment:
      BOOTSTRAP_SERVERS: kafka:9092
      GROUP_ID: debezium
      CONFIG_STORAGE_TOPIC: debezium_configs
      OFFSET_STORAGE_TOPIC: debezium_offsets
      STATUS_STORAGE_TOPIC: debezium_statuses
      CONFIG_STORAGE_REPLICATION_FACTOR: 1
      OFFSET_STORAGE_REPLICATION_FACTOR: 1
      STATUS_STORAGE_REPLICATION_FACTOR: 1
    ports:
      - '8083:8083'

  debezium-setup:
    image: curlimages/curl:8.11.1
    depends_on:
      - debezium
    restart: on-failure
    volumes:
      - ./docker/debezium:/config:ro
    entrypoint:
      - sh
      - -c
      - >
        until curl -sf http://debezium:8083/connectors; do sleep 2; done;
        curl -sf -X PUT -H 'Content-Type: application/json'
        --data @/config/tomato-connector.json
        http://debezium:8083/connectors/tomato-postgres/config

  spicedb-migrate:
    image: authzed/spicedb:v1.57.0
    command: migrate head
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      SPICEDB_DATASTORE_ENGINE: postgres
      SPICEDB_DATASTORE_CONN_URI: postgres://tomato:tomato@postgres:5432/spicedb?sslmode=disable
    restart: on-failure

  spicedb:
    image: authzed/spicedb:v1.57.0
    command: serve
    depends_on:
      spicedb-migrate:
        condition: service_completed_successfully
    environment:
      SPICEDB_GRPC_PRESHARED_KEY: tomato
      SPICEDB_DATASTORE_ENGINE: postgres
      SPICEDB_DATASTORE_CONN_URI: postgres://tomato:tomato@postgres:5432/spicedb?sslmode=disable
    ports:
      - '50051:50051'

volumes:
  postgres-data:
  kafka-data:
